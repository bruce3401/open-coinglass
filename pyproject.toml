[project]
name = "open-coinglass"
version = "0.2.0"
description = "Self-hosted crypto derivatives data aggregator (CoinGlass + CoinGecko) with a REST API and dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["crypto", "coinglass", "coingecko", "funding-rate", "open-interest", "liquidations", "fastapi"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "aiohttp>=3.9",
    "aiosqlite>=0.19",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=23.0",
    "playwright>=1.40",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/bruce3401/open-coinglass"
Repository = "https://github.com/bruce3401/open-coinglass"
Issues = "https://github.com/bruce3401/open-coinglass/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coininfo"]
